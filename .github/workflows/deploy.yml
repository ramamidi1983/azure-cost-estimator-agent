name: Deploy to Azure Container Apps

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'infra/**'
      - 'deploy/**'
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC login
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build & push image to ACR
        run: |
          az acr build \
            --registry "${{ vars.ACR_NAME }}" \
            --image "${{ vars.CONTAINERAPP_NAME }}:${IMAGE_TAG}" \
            --image "${{ vars.CONTAINERAPP_NAME }}:latest" \
            .

      - name: Update Container App
        run: |
          az containerapp update \
            --name "${{ vars.CONTAINERAPP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ vars.ACR_NAME }}.azurecr.io/${{ vars.CONTAINERAPP_NAME }}:${IMAGE_TAG}"

      - name: Show app URL
        run: |
          fqdn=$(az containerapp show \
            --name "${{ vars.CONTAINERAPP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "### Deployed :rocket: https://$fqdn" >> "$GITHUB_STEP_SUMMARY"
